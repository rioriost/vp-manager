[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vp-manager"
version = "0.1.0"
description = "Resumable local VOICEPEAK narration production with agent decisions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "soundfile==0.14.0"]

[project.urls]
Homepage = "https://github.com/rioriost/vp-manager"
Repository = "https://github.com/rioriost/vp-manager"
Issues = "https://github.com/rioriost/vp-manager/issues"

[project.optional-dependencies]
asr = ["mlx-whisper==0.4.3; sys_platform == 'darwin'"]
pdf = []

[project.scripts]
vp-manager = "vp_manager.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pymupdf>=1.26,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.uv]
environments = ["sys_platform == 'darwin'"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true


[tool.hatch.build.targets.wheel.force-include]
"plugins/voicepeak-production" = "vp_manager/bundled/voicepeak-production"
